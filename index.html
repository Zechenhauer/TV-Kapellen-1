<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. 1 - Darts Dashboard</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #151e32;
            --card-hover: #1e2942;
            --accent-gold: #ffb703;
            --accent-orange: #fb8500;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #24324d;
            --stat-bg: #0f172a;
            --badge-green: #10b981;
            --badge-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.3);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 400;
        }

        .search-container {
            position: relative;
            margin: 25px 0 35px 0;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 650px;
            padding: 16px 24px;
            border-radius: 50px;
            border: 2px solid var(--accent-gold);
            background-color: #111a2e;
            color: #fff;
            font-size: 1.05rem;
            outline: none;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.15);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            box-shadow: 0 0 25px rgba(255, 183, 3, 0.35);
            border-color: var(--accent-orange);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .loading-status {
            text-align: center;
            color: var(--accent-gold);
            font-size: 1.2rem;
            margin: 50px 0;
            font-weight: 600;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 22px;
            width: 100%;
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 22px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .player-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: rgba(255, 183, 3, 0.4);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.6);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .player-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
        }

        .player-avg {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
            color: #000;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--stat-bg);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .stat-label {
            color: var(--text-muted);
        }

        .stat-val {
            font-weight: 700;
            color: var(--text-main);
        }

        .highlight-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid var(--border-color);
        }

        .badge-gold {
            background-color: rgba(255, 183, 3, 0.15);
            color: var(--accent-gold);
            border-color: rgba(255, 183, 3, 0.3);
        }

        .badge-green {
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--badge-green);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-muted);
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>TV KAPELLEN 1919 E.V. 1</h1>
            <p class="subtitle">Saisonübersicht & Spieler-Statistiken</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Nach Spieler-Name suchen..." oninput="filterPlayers()">
        </div>

        <div id="loadingMessage" class="loading-status">
            Lade Daten aus Google Sheets...
        </div>

        <div id="statsGrid" class="stats-grid"></div>
    </div>

    <script>
        // Veröffentlichter CSV-Link der 1. Mannschaft
        const SHEETS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTdTOUA5sqMlTVxxUZWLn-ce3HNdvCbLfmLZIgT7EKJ0tYAT3OqZhx3T_BMvpglwU5tDUxmjvUIRbHz/pub?gid=2097702849&single=true&output=csv";

        let allPlayersData = [];

        async function loadDataFromSheets() {
            const loadingEl = document.getElementById("loadingMessage");
            
            // Proxy zur Umgehung von CORS-Blockaden bei lokaler Ausführung
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(SHEETS_CSV_URL);

            try {
                let dataText;
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error("Proxy fetch failed");
                    dataText = await response.text();
                } catch (proxyError) {
                    const fallbackRes = await fetch(SHEETS_CSV_URL);
                    if (!fallbackRes.ok) throw new Error("Direct fetch failed");
                    dataText = await fallbackRes.text();
                }

                const rows = parseCSV(dataText);
                if (rows.length <= 1) {
                    loadingEl.innerHTML = "⚠️ Keine Daten im Tabellenblatt gefunden.";
                    return;
                }

                processDartsData(rows);
                loadingEl.style.display = "none";
            } catch (error) {
                console.error("Ladefehler:", error);
                loadingEl.innerHTML = "⚠️ Fehler beim Laden der Daten. Bitte Freigabe im Tabellenblatt prüfen.";
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            return lines.map(line => {
                const values = [];
                let insideQuotes = false;
                let currentValue = '';
                
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        values.push(currentValue.trim().replace(/^"|"$/g, ''));
                        currentValue = '';
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                return values;
            }).filter(row => row.some(cell => cell !== ''));
        }

        function processDartsData(rows) {
            const headers = rows[0].map(h => h.trim());
            allPlayersData = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row[0] || row[0].trim() === "") continue;

                const player = {
                    name: row[0],
                    avg: "0.00",
                    stats: [],
                    highlights: []
                };

                for (let j = 1; j < headers.length; j++) {
                    const key = headers[j];
                    const val = row[j] || "0";

                    if (!key) continue;

                    const keyLower = key.toLowerCase();

                    // Besondere Schlüsselwörter für das Dashboard aufbereiten
                    if (keyLower.includes("avg") || keyLower.includes("average")) {
                        player.avg = val;
                    } else if (keyLower.includes("180") || keyLower.includes("high finish") || keyLower.includes("short leg") || keyLower.includes("bullen")) {
                        if (val !== "0" && val !== "" && val !== "-") {
                            player.highlights.push({ label: key, val: val });
                        }
                    } else {
                        player.stats.push({ label: key, val: val });
                    }
                }

                allPlayersData.push(player);
            }

            renderPlayers(allPlayersData);
        }

        function renderPlayers(players) {
            const grid = document.getElementById("statsGrid");
            grid.innerHTML = "";

            if (players.length === 0) {
                grid.innerHTML = '<div class="no-results">Keine Spieler gefunden.</div>';
                return;
            }

            players.forEach(player => {
                const card = document.createElement("div");
                card.className = "player-card";

                let statsListHtml = player.stats.map(s => `
                    <div class="stat-item">
                        <span class="stat-label">${escapeHtml(s.label)}</span>
                        <span class="stat-val">${escapeHtml(s.val)}</span>
                    </div>
                `).join('');

                let highlightsHtml = "";
                if (player.highlights.length > 0) {
                    highlightsHtml = `
                        <div class="highlight-section">
                            ${player.highlights.map(h => `
                                <span class="badge badge-gold">🔥 ${escapeHtml(h.label)}: ${escapeHtml(h.val)}</span>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="player-name">${escapeHtml(player.name)}</span>
                            <span class="player-avg">Ø ${escapeHtml(player.avg)}</span>
                        </div>
                        <div class="stats-list">
                            ${statsListHtml}
                        </div>
                    </div>
                    ${highlightsHtml}
                `;

                grid.appendChild(card);
            });
        }

        function filterPlayers() {
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            const filtered = allPlayersData.filter(player => 
                player.name.toLowerCase().includes(searchTerm)
            );
            renderPlayers(filtered);
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function(s) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                }[s];
            });
        }

        document.addEventListener("DOMContentLoaded", loadDataFromSheets);
    </script>
</body>
</html>
